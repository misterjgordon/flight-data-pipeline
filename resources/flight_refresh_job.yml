resources:
  jobs:
    flight_refresh_job:
      name: Flight Data Pipeline — Scheduled Refresh
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED
      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.flight_data_pipeline.id}
            # Scheduled runs stay incremental. One-off full refresh: UI or `make pipeline-full-refresh-dev`.
            full_refresh: false
